name: Build Striker Firmware

"on":
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      console_ssid:
        description: "Management AP SSID"
        required: false
        default: "NetStrike32"
      console_key:
        description: "Management AP Password (min 8 chars)"
        required: false
        default: "Strike32!"
      console_client_limit:
        description: "Max concurrent clients on management AP"
        required: false
        default: "1"
      radar_max_targets:
        description: "Max APs per scan (5-50)"
        required: false
        default: "20"

jobs:
  build:
    name: Build Firmware (ESP32)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache ESP-IDF
        uses: actions/cache@v4
        with:
          path: |
            ~/esp/esp-idf
            ~/.espressif
          key: esp-idf-v5.2-${{ runner.os }}
          restore-keys: |
            esp-idf-v5.2-

      - name: Install ESP-IDF v5.2
        run: |
          if [ ! -d "$HOME/esp/esp-idf" ]; then
            mkdir -p ~/esp
            git clone --branch v5.2.1 --depth 1 \
              https://github.com/espressif/esp-idf.git ~/esp/esp-idf
          fi
          ~/esp/esp-idf/install.sh esp32

      - name: Apply custom sdkconfig
        if: github.event_name == 'workflow_dispatch'
        run: |
          SSID="${{ github.event.inputs.console_ssid }}"
          KEY="${{ github.event.inputs.console_key }}"
          LIMIT="${{ github.event.inputs.console_client_limit }}"
          RADAR="${{ github.event.inputs.radar_max_targets }}"

          sed -i "s|CONFIG_CONSOLE_SSID=.*|CONFIG_CONSOLE_SSID=\"${SSID}\"|"            sdkconfig.defaults
          sed -i "s|CONFIG_CONSOLE_KEY=.*|CONFIG_CONSOLE_KEY=\"${KEY}\"|"                sdkconfig.defaults
          sed -i "s|CONFIG_CONSOLE_CLIENT_LIMIT=.*|CONFIG_CONSOLE_CLIENT_LIMIT=${LIMIT}|" sdkconfig.defaults
          sed -i "s|CONFIG_RADAR_MAX_TARGETS=.*|CONFIG_RADAR_MAX_TARGETS=${RADAR}|"      sdkconfig.defaults

      - name: Build firmware
        run: |
          source ~/esp/esp-idf/export.sh
          idf.py set-target esp32
          idf.py build
        env:
          IDF_TARGET: esp32

      - name: Collect firmware
        run: |
          mkdir -p firmware
          cp build/NetStrike32.bin                     firmware/striker.bin
          cp build/bootloader/bootloader.bin           firmware/bootloader.bin
          cp build/partition_table/partition-table.bin firmware/partition-table.bin
          cp build/flash_args                          firmware/flash_args.txt

      - name: Generate flash manifest
        run: |
          python3 - << 'PYEOF'
          import json
          manifest = {
            "name": "Striker",
            "new_install_prompt_erase": True,
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  { "path": "bootloader.bin",     "offset": 4096  },
                  { "path": "partition-table.bin", "offset": 32768 },
                  { "path": "striker.bin",         "offset": 65536 }
                ]
              }
            ]
          }
          with open("firmware/manifest.json", "w") as f:
            json.dump(manifest, f, indent=2)
          PYEOF

      - name: Commit firmware to repo
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add firmware/
          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "ci: update firmware build [$(date -u '+%Y-%m-%d %H:%M UTC')]

          Commit : ${{ github.sha }}
          Branch : ${{ github.ref_name }}
          Trigger: ${{ github.event_name }}"

          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: striker-firmware-${{ github.sha }}
          path: firmware/
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Striker ${{ github.ref_name }}
          body: |
            ## Striker ${{ github.ref_name }}

            ### Flash via browser (Chrome / Edge only)
            Open the [Web Flasher](https://MatrixTM26.github.io/Striker), connect ESP32, click Install.

            ### Flash via ESP Web Flasher (esp.huhn.me)
            Download all files below, open [esp.huhn.me](https://esp.huhn.me), and flash at these offsets:

            | File | Offset |
            |------|--------|
            | `bootloader.bin` | `0x1000` |
            | `partition-table.bin` | `0x8000` |
            | `striker.bin` | `0x10000` |

            ### Flash via esptool
            ```bash
            esptool.py --chip esp32 --baud 460800 write_flash \
              0x1000  bootloader.bin \
              0x8000  partition-table.bin \
              0x10000 striker.bin
            ```

            ### Default Management AP
            ```
            SSID     : NetStrike32
            Password : Strike32!
            URL      : http://192.168.4.1
            ```
          files: |
            firmware/striker.bin
            firmware/bootloader.bin
            firmware/partition-table.bin
            firmware/manifest.json
            firmware/flash_args.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: Deploy Web Flasher (GitHub Pages)
    runs-on: ubuntu-22.04
    needs: build
    if: >
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: striker-firmware-${{ github.sha }}
          path: docs/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
